<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog /proc/self/fd/2

    # Avoid logging query strings containing password-reset tokens.
    LogFormat "%h %t \"%m %U %H\" %>s %b" safe
    CustomLog /proc/self/fd/1 safe
</VirtualHost>